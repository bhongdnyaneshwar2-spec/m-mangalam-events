
name: Build M Mangalam APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'm-mangalam-events-apk-build.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project ZIP
        run: |
          unzip -q m-mangalam-events-apk-build.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/mangalam_project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Mangalam-debug-apk
          path: extracted/mangalam_project/app/build/outputs/apk/debug/*.apk
